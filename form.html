<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- SEO Meta -->
        <meta name="description" content="Visit Kuwait. A guide on why you should visit Kuwait. Ideas on places to visit, attractions, hotels, and other travel information.">
        <meta name="keywords" content="visit Kuwait, travel, holiday, Middle East, Arabic">
        <meta name="author" content="Your Name or Brand">
        <title>Visit Kuwait</title>

        <!-- Favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

        <!-- Styles -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/styles.css">
    </head>
    <body class="bg-travel-theme">

        <!-- Header -->
        <header class="py-5 text-center shadow-sm">
            <div class="container">
                <h1 class="text-p display-4 fw-bold py-2 rounded">Kuwait Travel</h1>
                <p class="lead mt-3 px-2 px-3 mx-auto text-s fw-medium" style="max-width: 800px;">
                    Now is your time to input your details so that we can help you secure your journey of a lifetime 
                    and go on that holiday people only dream of.
                </p>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="navbar navbar-expand-md navbar-light shadow-sm sticky-top">
            <div class="container">
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars fs-1"></i>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav w-100 justify-content-center text-center gap-lg-5 gap-3">
                        <li class="nav-item">
                            <a href="index.html" class="nav-link fw-semibold px-3">
                                <i class="fa-solid fa-house me-1"></i> Welcome
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="gallery.html" class="nav-link fw-semibold px-3" aria-current="page">
                                <i class="fa-solid fa-images me-1"></i> Photo Album
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="form.html" class="nav-link active fw-semibold px-3" aria-current="page">
                                <i class="fa-solid fa-file-signature me-1"></i> Get in Touch
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <!-- Main Content -->
        <main id="form" class="py-5">
            <div class="container">
                <div class="row justify-content-center">

                    <div class="col-12 col-lg-8 col-xl-7">
                        
                        <div class="card shadow-lg border-0 rounded-4 overflow-hidden bg-transparent-light">
                            <div class="card-header bg-s text-center py-3">
                                <h3 class="text-p mb-0 fw-bold">Sign Up</h3>
                            </div>
                            
                            <div class="card-body p-4 p-md-5">
                                <form action="confirmation.html" id="sign-up">
                                    
                                    <!-- Personal Details -->
                                    <fieldset class="mb-5">
                                        <legend class="fw-bold text-p border-bottom pb-2 mb-4">
                                            Personal Details <i class="fa-solid fa-id-card ms-2 text-success"></i>
                                        </legend>
                                        
                                        <div class="mb-3">
                                            <label for="full-name" class="form-label fw-semibold">Full Name</label>
                                            <input type="text" id="full-name" name="full-name" class="form-control form-control-lg" required placeholder="John Doe">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="email" class="form-label fw-semibold">Email</label>
                                            <input type="email" id="email" name="email" class="form-control form-control-lg" required placeholder="email@example.com">
                                        </div>
                                    </fieldset>
                                    
                                    <!-- Travel Details -->
                                    <fieldset class="mb-5">
                                        <legend class="fw-bold text-p border-bottom pb-2 mb-4">
                                            Travel Details <i class="fa-solid fa-globe ms-2 text-success"></i>
                                        </legend>
                                        
                                        <div class="row g-3 mb-4">
                                            <div class="col-md-6">
                                                <label for="adults" class="form-label fw-semibold">Adults</label>
                                                <input type="number" id="adults" name="adults" class="form-control" required min="1" value="1">
                                            </div>
                                            <div class="col-md-6">
                                                <label for="child" class="form-label fw-semibold">Children</label>
                                                <input type="number" id="child" name="child" class="form-control" required min="0" value="0">
                                            </div>
                                        </div>
                                        
                                        <div class="row g-3 mb-4">
                                            <div class="col-md-6">
                                                <label for="arrival" class="form-label fw-semibold">Arrival Date</label>
                                                <input type="date" id="arrival" name="arrival" class="form-control" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="depart" class="form-label fw-semibold">Departure Date</label>
                                            <input type="date" id="depart" name="depart" class="form-control" required>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label class="form-label fw-bold d-block mb-3">Choose Your Package</label>
                                        <div class="bg-light p-3 rounded-3 d-flex flex-wrap gap-3">
                                            <div class="form-check">
                                                <input type="checkbox" id="all-incluse" class="form-check-input" name="packages" value="All-inclusive" checked>
                                                <label for="all-incluse" class="form-check-label">All Inclusive</label>
                                            </div>
                                            <div class="form-check">
                                                <input type="checkbox" id="full" class="form-check-input" name="packages" value="Full-board">
                                                <label for="full" class="form-check-label">Full Board</label>
                                            </div>
                                            <div class="form-check">
                                                <input type="checkbox" id="half" class="form-check-input" name="packages" value="Half-board">
                                                <label for="half" class="form-check-label">Half Board</label>
                                            </div>
                                            <div class="form-check">
                                                <input type="checkbox" id="b-b" class="form-check-input" name="packages" value="B&B">
                                                <label for="b-b" class="form-check-label">Bed & Breakfast</label>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label for="area-stay" class="form-label fw-semibold">Preferred Region</label>
                                        <select name="area-of-stay" id="area-stay" class="form-select">
                                            <option value="" selected disabled>Select a location...</option>
                                            <option value="1">Kuwait City</option>
                                            <option value="2">Al Jahra</option>
                                            <option value="3">Ahmadi</option>
                                            <option value="4">Salmiya</option>
                                            <option value="5">Other (Specify below)</option>
                                        </select>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="notes" class="form-label fw-semibold">Specific Interests or Zones</label>
                                        <textarea id="notes" name="specific-notes" class="form-control" rows="4" placeholder="Tell us about any specific landmarks or districts you want to visit..."></textarea>
                                    </div>
                                </fieldset>
                                
                                <!-- Terms -->
                                <div class="mb-5 p-4 bg-light rounded-4 text-center">
                                    <p class="mb-3">
                                        I agree to the 
                                        <a href="https://documents.travelguard.com/..." target="_blank" class="text-decoration-underline fw-bold">Terms & Conditions</a>
                                    </p>
                                    <div class="d-flex justify-content-center gap-4">
                                        <div class="form-check">
                                            <input type="radio" id="agree" class="form-check-input" name="terms" value="Agree" required>
                                            <label for="agree" class="form-check-label">I Agree</label>
                                        </div>
                                        <div class="form-check">
                                            <input type="radio" id="disagree" class="form-check-input" name="terms" value="Disagree" checked required>
                                            <label for="disagree" class="form-check-label">I Disagree</label>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Buttons -->
                                <div class="row g-3">
                                    <div class="col-sm-8">
                                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold text-uppercase shadow-sm">Submit Request</button>
                                    </div>
                                    <div class="col-sm-4">
                                        <button type="reset" class="btn btn-outline-secondary btn-lg w-100 shadow-sm">Reset</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
        </main>

        <!-- Footer -->
        <footer class="py-4 mt-auto">
            <div class="container text-center">
                <p class="fw-bold mb-3">Connect with us</p>
                <div id="socials" class="d-flex justify-content-center gap-4">
                    <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="fs-2"><i class="fa-brands fa-facebook"></i></a>
                    <a href="https://www.twitter.com/" target="_blank" rel="noopener noreferrer" class="fs-2"><i class="fa-brands fa-twitter"></i></a>
                    <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" class="fs-2"><i class="fa-brands fa-youtube"></i></a>
                    <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="fs-2"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
        </footer>

        <!-- Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Font Awesome kit -->
        <script src="https://kit.fontawesome.com/5c8b8e6738.js" crossorigin="anonymous"></script>
        <!-- JS navigation listener -->
        <script>
            document.addEventListener('click', function (event) {
                const navbar = document.getElementById('navbarNav');
                    const bCollapse = new bootstrap.Collapse(navbar, {toggle: false});
                    const isOpen = navbar.classList.contains('show');
                    const clickedInside = navbar.contains(event.target);
                    const isToggler = event.target.closest('.navbar-toggler');
                    
                    if (isOpen && !clickedInside && !isToggler) {
                        bCollapse.hide();
                    }
                });
        </script>

    </body>
</html>
