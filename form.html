<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- SEO Meta -->
        <meta name="description" content="Visit Kuwait. A guide on why you should visit Kuwait. Ideas on places to visit, attractions, hotels, and other travel information.">
        <meta name="keywords" content="visit Kuwait, travel, holiday, Middle East, Arabic">
        <meta name="author" content="Your Name or Brand">
        <title>Visit Kuwait</title>

        <!-- Favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

        <!-- Styles -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/styles.css">
    </head>
    <body>
        <!-- Header content -->
        <header class="py-4 px-3 text-center">
            <div class="container">
                <h2 class="text-p display-4 fw-bold py-2 rounded">kuwait Travel</h2>
                <p class="mt-3 px-2 fs-5 text-s rounded">Now is your time to input your details, so that we can help you secure your journey of a lifetime and go on that holiday people only dream of.</p>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="navbar navbar-expand-md navbar-custom">
            <div class="container-fluid">
                <!-- Toggler button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <!-- Navbar links -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav w-100 justify-content-evenly text-center">
                        <li class="nav-item" id="home-nav">
                            <a href="index.html" class="nav-link" aria-current="page">
                                <i class="fa-solid fa-house"></i>
                                <span>Welcome page</span>
                            </a>
                        </li>
                        <li class="nav-item" id="gallery-nav">
                            <a href="gallery.html" class="nav-link">
                                <i class="fa-solid fa-images"></i>
                                <span>Photo album</span>
                            </a>
                        </li>
                        <li class="nav-item" id="form-nav">
                            <a href="form.html" class="nav-link active">
                                <i class="fa-solid fa-file-signature"></i>
                                <span>Get in touch</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <!-- Main content -->
        <main>
            <section id="form">
                <div class="container-fluid py-4">
                    <div class="row justify-content-center">
                        <div class="col-12 px-3">
                            <div class="card bg-transparent-light shadow p-4 w-100">
                                <h3 class="text-center mb-4 text-s">Sign up</h3>
                                <form action="confirmation.html" id="sign-up">
                                    <!-- Personal Details -->
                                    <fieldset class="mb-4">
                                        <legend>Personal Details <i class="fa-solid fa-id-card"></i></legend>

                                        <div class="mb-3">
                                            <label for="full-name" class="form-label">Full Name</label>
                                            <input type="text" id="full-name" name="full-name" class="form-control" required placeholder="Name required">
                                        </div>

                                        <div class="mb-3">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" id="email" name="email" class="form-control" required placeholder="Email required">
                                        </div>
                                    </fieldset>

                                    <!-- Travel Details -->
                                    <fieldset class="mb-4">
                                        <legend>Travel Details <i class="fa-solid fa-globe"></i></legend>

                                        <div class="row mb-3">
                                            <div class="col-md-6">
                                                <label for="adults" class="form-label">Adults</label>
                                                <input type="number" id="adults" name="adults" class="form-control" required min="1" placeholder="Total required">
                                            </div>
                                        <div class="col-md-6">
                                            <label for="child" class="form-label">Children</label>
                                            <input type="number" id="child" name="child" class="form-control" required placeholder="Total required">
                                        </div>
                                        </div>

                                        <div class="row mb-3">
                                            <div class="col-md-6">
                                                <label for="arrival" class="form-label">Arrival</label>
                                                <input type="date" id="arrival" name="arrival" class="form-control" required>
                                            </div>
                                            <div class="col-md-6">
                                                <label for="depart" class="form-label">Departure</label>
                                                <input type="date" id="depart" name="depart" class="form-control" required>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label d-block">Packages</label>
                                            <div class="form-check form-check-inline">
                                                <input type="checkbox" id="all-incluse" class="form-check-input" name="packages" value="All-inclusive" checked>
                                                <label for="all-incluse" class="form-check-label">All Inclusive</label>
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <input type="checkbox" id="full" class="form-check-input" name="packages" value="Full-board">
                                                <label for="full" class="form-check-label">Full Board</label>
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <input type="checkbox" id="half" class="form-check-input" name="packages" value="Half-board">
                                                <label for="half" class="form-check-label">Half Board</label>
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <input type="checkbox" id="b-b" class="form-check-input" name="packages" value="B&B">
                                                <label for="b-b" class="form-check-label">Bed & Breakfast</label>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label for="area-stay" class="form-label">City/Town/Village (optional)</label>
                                            <select name="area-of-stay" id="area-stay" class="form-select">
                                                <option value="">(select one)</option>
                                                <option value="1">Kuwait City</option>
                                                <option value="2">Al Jahra</option>
                                                <option value="3">Ahmadi</option>
                                                <option value="4">Salmiya</option>
                                                <option value="5">Other</option>
                                            </select>
                                        </div>

                                        <div class="mb-3">
                                            <textarea name="area-of-stay" class="form-control" rows="4" placeholder="Please tell us if there is a specific place or zone you would like to stay."></textarea>
                                        </div>
                                    </fieldset>

                                    <!-- Terms -->
                                    <div class="mb-4 text-center">
                                        <p>
                                        I agree to the 
                                        <a href="https://documents.travelguard.com/dynamicdoc?parser=tags&document-type=pwd&partner=qatar&country=kw" target="_blank">Terms & Conditions</a>
                                        </p>
                                        <div class="form-check form-check-inline">
                                            <input type="radio" id="agree" class="form-check-input" name="terms" value="Agree" required>
                                            <label for="agree" class="form-check-label">Agree</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="radio" id="disagree" class="form-check-input" name="terms" value="Disagree" checked required>
                                            <label for="disagree" class="form-check-label">Disagree</label>
                                        </div>
                                    </div>

                                    <!-- Buttons -->
                                    <div class="d-grid gap-2">
                                        <input type="submit" class="btn btn-success" value="Submit">
                                        <input type="reset" class="btn btn-secondary" value="Refresh">
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="py-3">
            <div class="container text-center">
                <ul id="socials" class="list-inline mb-0">
                    <li class="list-inline-item mx-2">
                        <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook" class="text-p-highlight fs-4">
                        <i class="fa-brands fa-facebook"></i>
                        </a>
                    </li>
                    <li class="list-inline-item mx-2">
                        <a href="https://www.twitter.com/" target="_blank" rel="noopener" aria-label="Twitter" class="text-p-highlight fs-4">
                        <i class="fa-brands fa-twitter"></i>
                        </a>
                    </li>
                    <li class="list-inline-item mx-2">
                        <a href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube" class="text-p-highlight fs-4">
                        <i class="fa-brands fa-youtube"></i>
                        </a>
                    </li>
                    <li class="list-inline-item mx-2">
                        <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram" class="text-p-highlight fs-4">
                        <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>
                    <li class="list-inline-item mx-2">
                        <a href="https://www.tiktok.com/" target="_blank" rel="noopener" aria-label="TikTok" class="text-p-highlight fs-4">
                        <i class="fa-brands fa-tiktok"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </footer>

        <!-- Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Font Awesome kit -->
        <script src="https://kit.fontawesome.com/5c8b8e6738.js" crossorigin="anonymous"></script>
    </body>
</html>
