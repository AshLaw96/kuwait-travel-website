    <script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/5c8b8e6738.js" crossorigin="anonymous"></script>
    <!-- JS navigation listener -->
    <script>
        document.addEventListener('click', function (event) {
            const navbar = document.getElementById('navbarNav'); // Ensure your navbar <div> has this ID
                const bCollapse = new bootstrap.Collapse(navbar, {toggle: false});
                const isOpen = navbar.classList.contains('show');
                const clickedInside = navbar.contains(event.target);
                const isToggler = event.target.closest('.navbar-toggler');
                
                // If the menu is open and we clicked outside of it (and not on the toggle button itself)
                if (isOpen && !clickedInside && !isToggler) {
                    bCollapse.hide();
                }
            });
    </script>
